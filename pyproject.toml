[project]
name = "biopolicy-api"
version = "0.1.0"
description = "BioPolicy — citation-grounded document Q&A for insurance policies and legal contracts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    # --- web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    # --- supabase / postgres ---
    "supabase>=2.10",
    "asyncpg>=0.30",
    "pyjwt[crypto]>=2.9",
    # --- pdf parsing (permissive licences only; see docs/adr/002) ---
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "pillow>=11.0",
    # --- chunking (llama-index node parsers ONLY; see docs/adr/003) ---
    "llama-index-core>=0.12",
    # --- model providers ---
    "anthropic>=0.40",
    "google-genai>=0.3",
    # --- misc ---
    "tenacity>=9.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["api", "eval"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "ASYNC",
    "S",   # bandit (security)
    "RUF",
]
ignore = [
    "E501",   # line length is handled by the formatter
    "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"api/tests/**" = ["S", "N"]
"eval/**" = ["S"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^web/", "^\\.venv/"]

[[tool.mypy.overrides]]
# These ship without complete type information.
module = ["pdfplumber.*", "pypdfium2.*", "llama_index.*", "supabase.*", "gotrue.*", "storage3.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["api/tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires live Supabase / provider credentials",
    "eval: part of the evaluation harness, costs money",
]
